<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4fb0ff"/>
      <stop offset="1" stop-color="#c4e8ff"/>
    </linearGradient>
    <symbol id="stone" viewBox="0 0 44 44">
      <rect width="44" height="44" fill="#7d838c"/>
      <rect width="44" height="6" fill="#9ca2ab"/>
      <rect y="38" width="44" height="6" fill="#5c6169"/>
      <rect x="38" y="6" width="6" height="32" fill="#6a7078"/>
      <rect x="16" y="20" width="6" height="4" fill="#6a7078"/>
    </symbol>
    <symbol id="specks" viewBox="0 0 44 44">
      <rect x="6" y="9" width="7" height="7"/><rect x="29" y="8" width="7" height="7"/>
      <rect x="8" y="29" width="7" height="7"/><rect x="28" y="28" width="7" height="7"/>
    </symbol>
    <g id="cloud" fill="#fff">
      <rect x="0" y="8" width="56" height="12"/><rect x="12" y="0" width="28" height="10"/>
    </g>
  </defs>
  <style>
    .float{animation:bob 3s ease-in-out infinite}
    .d1{animation-delay:-.6s}.d2{animation-delay:-1.2s}.d3{animation-delay:-1.8s}
    @keyframes bob{50%{transform:translateY(-5px)}}
    @media (prefers-reduced-motion:reduce){.float{animation:none}}
  </style>
  <rect width="320" height="180" fill="url(#sky)"/>
  <rect x="262" y="16" width="32" height="32" fill="#fff6b0"/>
  <rect x="268" y="22" width="20" height="20" fill="#ffdd40"/>
  <use href="#cloud" x="24" y="20"/>
  <use href="#cloud" x="168" y="36" opacity=".8"/>
  <!-- distant hills -->
  <path fill="#86cf73" d="M0 118h24v-12h32v-10h40v14h28v8h52v-18h32v-12h40v22h26v-10h46v18v50H0z"/>
  <!-- ground -->
  <rect y="128" width="320" height="52" fill="#8a5a33"/>
  <rect y="122" width="320" height="10" fill="#5cbf3d"/>
  <path fill="#5cbf3d" d="M0 132h10v4H0zM22 132h6v7h-6zM44 132h12v4H44zM70 132h5v6h-5zM92 132h10v4H92zM128 132h6v7h-6zM150 132h14v4h-14zM186 132h6v6h-6zM210 132h10v4h-10zM236 132h6v7h-6zM262 132h12v4h-12zM290 132h6v6h-6zM306 132h14v4h-14z"/>
  <g fill="#6c4322">
    <rect x="14" y="148" width="6" height="6"/><rect x="58" y="160" width="6" height="6"/><rect x="104" y="146" width="6" height="6"/>
    <rect x="146" y="166" width="6" height="6"/><rect x="198" y="150" width="6" height="6"/><rect x="242" y="164" width="6" height="6"/>
    <rect x="286" y="148" width="6" height="6"/><rect x="36" y="170" width="6" height="6"/><rect x="226" y="140" width="6" height="6"/>
  </g>
  <!-- pixel tree -->
  <rect x="22" y="86" width="10" height="36" fill="#7a4b26"/>
  <rect x="6" y="58" width="42" height="30" fill="#2f9e3a"/>
  <rect x="14" y="48" width="26" height="12" fill="#2f9e3a"/>
  <rect x="10" y="62" width="8" height="8" fill="#45bb4f"/><rect x="30" y="52" width="8" height="8" fill="#45bb4f"/>
  <!-- shadows -->
  <g fill="#3f8e2a" opacity=".6">
    <rect x="74" y="124" width="36" height="5"/><rect x="126" y="124" width="36" height="5"/>
    <rect x="178" y="124" width="36" height="5"/><rect x="230" y="124" width="36" height="5"/>
  </g>
  <!-- ore blocks: 3,742 -->
  <g font-family="Rubik, 'Arial Black', Arial, sans-serif" font-weight="900" font-size="27" text-anchor="middle" fill="#fff" stroke="#1d1d29" stroke-width="5" paint-order="stroke">
    <g class="float">
      <use href="#stone" x="70" y="62" width="44" height="44"/>
      <use href="#specks" x="70" y="62" width="44" height="44" fill="#ffd84a"/>
      <text x="92" y="94">3</text>
    </g>
    <rect x="116" y="96" width="5" height="9" fill="#1d1d29" stroke="none"/>
    <g class="float d1">
      <use href="#stone" x="124" y="62" width="44" height="44"/>
      <use href="#specks" x="124" y="62" width="44" height="44" fill="#53e7e4"/>
      <text x="146" y="94">7</text>
    </g>
    <g class="float d2">
      <use href="#stone" x="176" y="62" width="44" height="44"/>
      <use href="#specks" x="176" y="62" width="44" height="44" fill="#3edb6c"/>
      <text x="198" y="94">4</text>
    </g>
    <g class="float d3">
      <use href="#stone" x="228" y="62" width="44" height="44"/>
      <use href="#specks" x="228" y="62" width="44" height="44" fill="#ff4a4a"/>
      <text x="250" y="94">2</text>
    </g>
  </g>
</svg>
