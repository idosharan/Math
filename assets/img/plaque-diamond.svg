  <text x="80" y="157" text-anchor="middle" font-family="Rubik, 'Arial Black', Arial, sans-serif" font-weight="900" font-size="14" fill="#7fe3f7">1M</text>
  <path d="M14 14h56L14 104z" fill="#fff" opacity=".12"/>
</svg>
