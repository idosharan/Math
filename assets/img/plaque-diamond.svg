<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 200">
  <defs>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a3f4f"/>
      <stop offset="1" stop-color="#16181f"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e3a5f"/>
      <stop offset="1" stop-color="#0b1a2e"/>
    </linearGradient>
    <linearGradient id="gemA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e0fbff"/>
      <stop offset="1" stop-color="#5ed6f0"/>
    </linearGradient>
    <linearGradient id="gemB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7fe3f7"/>
      <stop offset="1" stop-color="#2a9fc4"/>
    </linearGradient>
  </defs>
  <style>
    .shine{animation:sh 2.4s ease-in-out infinite}
    @keyframes sh{50%{opacity:.25}}
