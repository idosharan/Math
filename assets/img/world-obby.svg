<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5fc8ff"/>
      <stop offset="1" stop-color="#dff5ff"/>
    </linearGradient>
    <linearGradient id="lava" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb02e"/>
      <stop offset="1" stop-color="#ff3d2e"/>
    </linearGradient>
  </defs>
  <style>
    .glow{animation:pulse 1.6s ease-in-out infinite}
    @keyframes pulse{50%{opacity:.55}}
    @media (prefers-reduced-motion:reduce){.glow{animation:none}}
  </style>
  <rect width="320" height="180" fill="url(#sky)"/>
  <g fill="#fff" opacity=".9">
    <ellipse cx="60" cy="30" rx="30" ry="10"/><ellipse cx="80" cy="24" rx="18" ry="10"/>
    <ellipse cx="236" cy="22" rx="26" ry="8"/><ellipse cx="252" cy="17" rx="14" ry="8"/>
  </g>
  <!-- far islands -->
  <g fill="#9fd7f2">
    <rect x="18" y="70" width="34" height="8" rx="2"/><rect x="270" y="104" width="40" height="8" rx="2"/>
  </g>
  <!-- lava -->
  <path d="M0 152q20-8 40 0t40 0 40 0 40 0 40 0 40 0 40 0 40 0V180H0z" fill="url(#lava)"/>
  <g fill="#ffe27a" opacity=".8"><rect x="54" y="160" width="6" height="6"/><rect x="170" y="166" width="5" height="5"/><rect x="262" y="158" width="6" height="6"/></g>
  <!-- platforms: sequence 100,200,300,?,500 -->
  <g font-family="Rubik, 'Arial Black', Arial, sans-serif" font-weight="900" font-size="13" text-anchor="middle" fill="#fff">
    <rect x="10" y="128" width="52" height="8" fill="#ff7a7a"/><rect x="10" y="136" width="52" height="18" fill="#e0283b"/>
    <text x="36" y="150">100</text>
    <rect x="72" y="112" width="52" height="8" fill="#ffc37a"/><rect x="72" y="120" width="52" height="18" fill="#f28a14"/>
    <text x="98" y="134">200</text>
    <rect x="134" y="96" width="52" height="8" fill="#8af0a4"/><rect x="134" y="104" width="52" height="18" fill="#22b14c"/>
    <text x="160" y="118">300</text>
    <rect class="glow" x="192" y="76" width="60" height="34" rx="4" fill="#c99bff" opacity=".45"/>
    <rect x="196" y="80" width="52" height="8" fill="#c99bff"/><rect x="196" y="88" width="52" height="18" fill="#7c3aed"/>
    <text x="222" y="102" font-size="15">?</text>
    <rect x="258" y="64" width="52" height="8" fill="#8cc8ff"/><rect x="258" y="72" width="52" height="18" fill="#2563eb"/>
    <text x="284" y="86">500</text>
  </g>
  <!-- checkpoint flag -->
  <rect x="296" y="30" width="3" height="34" fill="#3b3b4f"/>
  <path d="M299 31h16l-5 6 5 6h-16z" fill="#3ee08f"/>
  <!-- jump arc -->
  <path d="M172 70q24-44 50 4" fill="none" stroke="#fff" stroke-width="3" stroke-dasharray="4 5" stroke-linecap="round"/>
  <!-- blocky hero -->
  <g transform="translate(150 42) rotate(-8)">
    <rect x="2" y="0" width="16" height="16" rx="2" fill="#ffd23f"/>
    <rect x="6" y="5" width="3" height="4" fill="#1b1b2b"/><rect x="11" y="5" width="3" height="4" fill="#1b1b2b"/>
    <path d="M6 11q4 3 8 0" stroke="#1b1b2b" stroke-width="1.6" fill="none"/>
    <rect x="1" y="17" width="18" height="16" fill="#2f6fe0"/>
    <rect x="-6" y="14" width="7" height="14" fill="#ffd23f" transform="rotate(-30 -2 17)"/>
    <rect x="19" y="14" width="7" height="14" fill="#ffd23f" transform="rotate(30 22 17)"/>
    <rect x="2" y="33" width="7" height="14" fill="#3bb54a"/><rect x="11" y="33" width="7" height="12" fill="#3bb54a"/>
  </g>
</svg>
