<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180">
  <defs>
    <radialGradient id="bg" cx=".5" cy=".45" r=".75">
      <stop offset="0" stop-color="#5a1022"/>
      <stop offset="1" stop-color="#12060c"/>
    </radialGradient>
    <radialGradient id="eye" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fff7b0"/>
      <stop offset=".5" stop-color="#ffd23f"/>
      <stop offset="1" stop-color="#ff5a1f"/>
    </radialGradient>
  </defs>
  <style>
    .blink{animation:glow 1.4s ease-in-out infinite}
    .shake{animation:shake 2.8s ease-in-out infinite}
    @keyframes glow{50%{opacity:.6}}
    @keyframes shake{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
    @media (prefers-reduced-motion:reduce){.blink,.shake{animation:none}}
  </style>
  <rect width="320" height="180" fill="url(#bg)"/>
  <!-- floor grid -->
  <g stroke="#ff3355" stroke-opacity=".35" stroke-width="1.5">
    <path d="M0 150h320M0 162h320M0 176h320"/>
    <path d="M160 140 40 180M160 140 100 180M160 140 160 180M160 140 220 180M160 140 280 180"/>
  </g>
  <!-- HP bar -->
  <rect x="70" y="12" width="180" height="16" rx="3" fill="#2a0b14" stroke="#ff4d6a" stroke-width="2"/>
  <g fill="#ff2e4d">
    <rect x="74" y="16" width="26" height="8"/><rect x="104" y="16" width="26" height="8"/>
    <rect x="134" y="16" width="26" height="8"/><rect x="164" y="16" width="26" height="8"/>
  </g>
  <rect x="194" y="16" width="26" height="8" fill="#ff2e4d" opacity=".3"/>
  <rect x="224" y="16" width="22" height="8" fill="#ff2e4d" opacity=".3"/>
  <!-- boss -->
  <g class="shake">
    <path d="M102 58 88 30l28 18zM218 58l14-28-28 18z" fill="#d6d6e8"/>
    <rect x="98" y="46" width="124" height="96" rx="10" fill="#3d3f5c"/>
    <rect x="98" y="46" width="124" height="16" rx="8" fill="#55587e"/>
    <rect x="106" y="70" width="108" height="34" fill="#1b1c2e"/>
    <g class="blink">
      <rect x="116" y="76" width="26" height="22" fill="url(#eye)"/>
      <rect x="178" y="76" width="26" height="22" fill="url(#eye)"/>
    </g>
    <rect x="124" y="82" width="8" height="10" fill="#1b1c2e"/>
    <rect x="186" y="82" width="8" height="10" fill="#1b1c2e"/>
    <!-- teeth mouth with math symbols -->
    <rect x="114" y="112" width="92" height="22" fill="#1b1c2e"/>
    <path d="M114 112h92l-6 8-6-8-6 8-6-8-6 8-6-8-6 8-6-8-6 8-6-8-6 8-6-8-6 8-6-8-6 8z" fill="#f4f4ff"/>
    <g font-family="Rubik, 'Arial Black', Arial, sans-serif" font-weight="900" font-size="12" fill="#ff4d6a" text-anchor="middle">
      <text x="134" y="132">×</text><text x="160" y="132">:</text><text x="186" y="132">−</text>
    </g>
    <rect x="74" y="88" width="24" height="12" fill="#3d3f5c"/><rect x="222" y="88" width="24" height="12" fill="#3d3f5c"/>
    <rect x="62" y="80" width="16" height="28" rx="4" fill="#55587e"/><rect x="242" y="80" width="16" height="28" rx="4" fill="#55587e"/>
  </g>
  <!-- sparks -->
  <g fill="#ffd23f">
    <rect x="40" y="60" width="5" height="5"/><rect x="270" y="50" width="6" height="6"/>
    <rect x="30" y="120" width="4" height="4"/><rect x="290" y="112" width="5" height="5"/>
  </g>
</svg>
